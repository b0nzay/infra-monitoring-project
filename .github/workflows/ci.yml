name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка синтаксиса Bash-скриптов
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Сделать скрипты исполняемыми
        run: chmod +x check_api.sh analyze_logs.sh

      - name: Тест check_api.sh (ожидается код возврата 0)
        run: ./check_api.sh https://httpbin.org/status/200

      - name: Тест analyze_logs.sh
        run: ./analyze_logs.sh
